<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="container">
  <div class="sticky-stack">
    <header class="header">
      <h1 title="Work is stored only on this device.">Task Tracker</h1>
      <div class="header-summary">
        <span><strong id="dayTotal">0h 00m</strong> <span id="daySummaryLabel">today</span></span>
        <span class="summary-sep">·</span>
        <span><strong id="weekTotal">0h 00m</strong> week</span>
      </div>
      <div class="menu-wrap">
        <button type="button" class="ghost" id="dataMenuBtn">Data</button>
        <div class="menu" id="dataMenu" hidden>
          <button type="button" id="downloadDbBtn">Download backup</button>
          <button type="button" id="uploadDbBtn">Upload backup</button>
          <button type="button" class="danger quiet" id="clearDbBtn">Clear all data</button>
        </div>
        <input id="uploadDbInput" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="running-hero" id="runningHero" hidden></div>
  </div>

  <div class="controls" id="startControls">
    <div class="name-field">
      <input id="taskName" type="text" placeholder="Task name" autocomplete="off" />
      <div class="suggest" id="nameSuggest" hidden></div>
    </div>
    <div class="duration-fields" id="durationFields" hidden>
      <input id="taskHours" type="number" min="0" step="1" placeholder="h" aria-label="Hours" />
      <input id="taskMinutes" type="number" min="0" max="59" step="1" placeholder="m" aria-label="Minutes" />
    </div>
    <button type="button" class="primary" id="startBtn" disabled>Start</button>
    <button type="button" class="primary" id="logBtn" hidden disabled title="Save this task with hours, without starting a timer">Log hours</button>
    <button type="button" class="text-btn" id="logToggle">Log hours</button>
  </div>

  <div class="section-head week-head">
    <h2>Week <span class="week-range" id="weekRange" title="Weekly total uses Monday through Saturday. A task crossing midnight is split at midnight, so each date gets only the time actually worked on that date."></span></h2>
    <div class="week-nav">
      <button type="button" id="prevWeek" aria-label="Previous week">‹</button>
      <input id="selectedDate" type="date" aria-label="Jump to date" />
      <button type="button" id="nextWeek" aria-label="Next week">›</button>
      <button type="button" id="todayBtn">Today</button>
    </div>
  </div>
  <div class="week" id="weekGrid"></div>

  <div class="section-head">
    <div class="section-copy">
      <h2 id="dateTitle"></h2>
      <p class="banner" id="viewingBanner" hidden></p>
    </div>
  </div>
  <div class="task-list" id="taskList"></div>

  <div class="eod-section" id="eodSection">
    <div class="section-head">
      <button type="button" class="eod-toggle" id="eodToggle" aria-expanded="false">
        <span class="eod-caret" aria-hidden="true">›</span>
        EOD
        <span class="week-range" id="eodDateLabel"></span>
        <span class="eod-dirty" id="eodDirty" hidden>edited</span>
        <span class="eod-head-total">· <strong id="eodTotal">0</strong> hrs</span>
      </button>
      <div class="week-nav">
        <button type="button" class="text-btn" id="copyEodBtn">Copy</button>
      </div>
    </div>
    <div class="eod-wrap" id="eodWrap" hidden>
      <div class="eod-toolbar">
        <span class="eod-hint">Scratch table for Teams. Edits stay on this page and are not saved.</span>
        <div class="eod-toolbar-actions">
          <button type="button" id="loadEodBtn" hidden title="Reload this table from tracked tasks for the selected date">Reset</button>
          <button type="button" id="addEodRowBtn">Add row</button>
        </div>
      </div>
      <table class="eod-table">
        <thead>
          <tr>
            <th>Task name</th>
            <th class="hrs">Hrs</th>
          </tr>
        </thead>
        <tbody id="eodBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="dialog">
    <h3>Edit task</h3>
    <div class="dialog-name">
      <label for="editName">Task name</label>
      <input id="editName" type="text" placeholder="Enter task name..." />
    </div>
    <div class="dialog-fields">
      <div>
        <label for="editHours">Hours</label>
        <input id="editHours" type="number" min="0" step="1" placeholder="0" />
      </div>
      <div>
        <label for="editMinutes">Minutes</label>
        <input id="editMinutes" type="number" min="0" max="59" step="1" placeholder="0" />
      </div>
    </div>
    <p class="dialog-error" id="editError" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="cancelEdit">Cancel</button>
      <button type="button" class="primary" id="saveEdit">Save</button>
    </div>
  </div>
</div>

<div class="modal" id="confirmModal">
  <div class="dialog">
    <h3 id="confirmTitle">Confirm</h3>
    <p class="dialog-copy" id="confirmMessage"></p>
    <div class="dialog-actions">
      <button type="button" id="confirmCancel">Cancel</button>
      <button type="button" class="danger" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<script src="js/time.js"></script>
<script src="js/state.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
